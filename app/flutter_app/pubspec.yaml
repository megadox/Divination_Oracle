name: divination_app
description: A Flutter divination app with free DB readings and Plus AI readings.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  package_info_plus: ^8.0.2
  purchases_flutter: ^10.2.2
  supabase_flutter: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/divinations/
    - assets/tarot/rws_major/
    - assets/tarot/rws_minor/
